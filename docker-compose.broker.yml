services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
      POSTGRES_DB: pact
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # The broker has connect_max_retries: 0, so it must not start before Postgres
    # accepts connections. depends_on alone only waits for the container to start.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact"]
      interval: 3s
      timeout: 3s
      retries: 20

  broker:
    image: pactfoundation/pact-broker:latest
    ports: ["9292:9292"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PACT_BROKER_DATABASE_URL: "postgres://pact:pact@postgres/pact"
      PACT_BROKER_BASIC_AUTH_USERNAME: "pact"
      PACT_BROKER_BASIC_AUTH_PASSWORD: "pact"
      PACT_BROKER_ALLOW_PUBLIC_READ: "true"
      # No Example App/Example API seed data and no pre-made environments: a genuinely empty broker.
      PACT_BROKER_SEED_EXAMPLE_DATA: "false"

volumes: { pgdata: {} }
