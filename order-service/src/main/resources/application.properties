spring.application.name=order-service
customer-service.base-url=http://localhost:8081

# The Kafka producer behind the AsyncAPI contract (docs/asyncapi/order-service-messages.yaml).
# Type headers are off: the AsyncAPI headers schema is the contract, and a __TypeId__ header would
# be an unspecified extra on every message.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# The AsyncAPI provider contract is generated from the publisher annotations.
springwolf.docket.base-package=com.example.order
springwolf.docket.default-content-type=application/json
springwolf.docket.info.title=order-service messages
springwolf.docket.info.version=1.0.0
springwolf.docket.servers.local.protocol=kafka
springwolf.docket.servers.local.host=localhost:9092
