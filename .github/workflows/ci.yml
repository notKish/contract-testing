name: ci

on:
  push:
    branches: [main, feat/pactflow]
  pull_request:

# Superseded runs are cancelled: no point burning a runner on a stale commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      PACT_CONSUMER_BRANCH: ${{ github.head_ref || github.ref_name }}
      # Branch recorded with the AsyncAPI provider contract published below.
      PACT_PROVIDER_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      # Full history: the AsyncAPI breaking-change gate reads the document at
      # the base commit.
      # actions/checkout v4.4.0, pinned to the commit SHA
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          # Nothing here pushes with the checkout token.
          persist-credentials: false

      # actions/setup-java v4.9.1, pinned to the commit SHA
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Both runs are broker-free: consumer tests generate pacts against a
      # mock, message consumer tests do the same, and the AsyncAPI document is
      # generated by AsyncApiContractTest. This is what pull requests get.
      - name: Consumer contract tests
        run: |
          ./gradlew :order-service:test :notification-service:test

      # The contract is generated from the code and committed, so the two
      # cannot silently diverge.
      - name: AsyncAPI document is current
        run: |
          if ! diff -u docs/asyncapi/order-service-messages.yaml \
            order-service/build/asyncapi/order-service-messages.yaml; then
            echo "::error::Run ./gradlew :order-service:updateAsyncApiDoc"
            echo "and commit docs/asyncapi/order-service-messages.yaml"
            exit 1
          fi

      # Breaking-change gate against the document on the base commit.
      # asyncapi-diff mislabels ref-heavy documents (a removed property comes
      # back as "unclassified"), so this fails on removed or renamed nodes
      # rather than trusting its "breaking" label.
      - name: AsyncAPI breaking-change gate
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          base="${base:-${{ github.event.before }}}"
          contract="docs/asyncapi/order-service-messages.yaml"
          if ! git cat-file -e "$base:$contract" 2>/dev/null; then
            echo "No contract at the base commit; nothing to compare."
            exit 0
          fi
          git show "$base:$contract" > /tmp/asyncapi-base.yaml
          npx --yes @asyncapi/cli@6.3.0 diff /tmp/asyncapi-base.yaml \
            "$contract" --json > /tmp/asyncapi-raw.txt 2>/dev/null
          # npx prints install notices on the same stream; JSON starts at "{".
          sed -n '/^{/,$p' /tmp/asyncapi-raw.txt > /tmp/asyncapi-diff.json
          python3 - <<'PY'
          import json
          import sys

          data = json.load(open("/tmp/asyncapi-diff.json"))["data"]["changes"]
          changes = data["changes"] if isinstance(data, dict) else data
          breaking = [
              c for c in changes if c.get("action") in ("remove", "rename")
          ]
          for change in breaking:
              print(f"{change['action']}: {change['path']}")
          sys.exit(1 if breaking else 0)
          PY

      # Everything below talks to PactFlow, so it only runs where the
      # secrets exist (pushes, not pull requests from forks). on.push decides
      # which branches publish.
      # Fail with a readable message instead of a connection error: a missing
      # secret arrives as "".
      - name: Require PactFlow secrets
        if: github.event_name == 'push'
        run: |
          if [ -z "$PACT_BROKER_BASE_URL" ] || [ -z "$PACT_BROKER_TOKEN" ]; then
            echo "::error::Set PACT_BROKER_BASE_URL and PACT_BROKER_TOKEN"
            echo "in Settings -> Secrets and variables -> Actions"
            exit 1
          fi

      # The message pact is published first: order-service's contract publishes
      # later, and PactFlow compares whichever side arrives last.
      - name: Publish the message pact
        if: github.event_name == 'push'
        run: ./gradlew :notification-service:pactPublish

      - name: Publish the HTTP pacts
        if: github.event_name == 'push'
        run: ./gradlew :order-service:pactPublish

      # --- Kafka message contract: AsyncAPI + Drift evidence ---
      # Drift verifies the running producer over a real broker, so this needs
      # Kafka and the application. No pact verifier runs on the provider side.
      - name: Start Kafka
        if: github.event_name == 'push'
        run: docker compose -f docker-compose.kafka.yml up -d kafka

      - name: Create the contracted topic
        if: github.event_name == 'push'
        run: |
          docker compose -f docker-compose.kafka.yml run --rm kafka-init

      - name: Build and start the producer
        if: github.event_name == 'push'
        run: |
          ./gradlew :order-service:bootJar
          nohup java -jar order-service/build/libs/order-service-*.jar \
            > /tmp/order-service.log 2>&1 &
          for _ in $(seq 1 90); do
            # 405 is the app answering: GET /orders is not mapped, POST is.
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              http://localhost:8080/orders || true)
            if [ "$code" = "405" ]; then exit 0; fi
            sleep 1
          done
          cat /tmp/order-service.log
          exit 1

      - name: Verify the producer against the AsyncAPI contract
        if: github.event_name == 'push'
        env:
          # Drift reads these if it needs a PactFlow identity.
          PACTFLOW_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
          PACTFLOW_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          mkdir -p "$HOME/drift"
          wget -qO- \
            https://download.pactflow.io/drift/latest/linux-x86_64.tgz \
            | tar xz -C "$HOME/drift"
          # The tarball bundles the core plugins only; Kafka is optional.
          "$HOME/drift/drift" component install kafka --yes
          set +e
          "$HOME/drift/drift" verify -f drift/order-created.testcases.yaml \
            --output-dir drift/output --generate-result
          echo "DRIFT_EXIT_CODE=$?" >> "$GITHUB_ENV"
          set -e

      # Publishes the document with Drift's result bundle as self-verification
      # evidence: PactFlow compares the consumer's message pact against it.
      - name: Publish the AsyncAPI provider contract
        if: github.event_name == 'push'
        run: |
          results=$(ls drift/output/results/verification.*.result | head -1)
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            -e PACT_BROKER_BASE_URL -e PACT_BROKER_TOKEN \
            pactfoundation/pact-cli pactflow publish-provider-contract \
            docs/asyncapi/order-service-messages.yaml \
            --provider order-service-messages \
            --provider-app-version "$(git rev-parse --short=12 HEAD)" \
            --branch "$PACT_PROVIDER_BRANCH" \
            --specification asyncapi \
            --content-type application/yaml \
            --verification-exit-code "$DRIFT_EXIT_CODE" \
            --verification-results "$results" \
            --verification-results-content-type \
            application/vnd.smartbear.drift.result \
            --verifier drift
          exit "$DRIFT_EXIT_CODE"

      # Compares this consumer version with the customer-service contract
      # deployed to `production`.
      - name: Can I deploy?
        if: github.event_name == 'push'
        run: |
          version=$(git rev-parse --short=12 HEAD)
          docker run --rm \
            -e PACT_BROKER_BASE_URL -e PACT_BROKER_TOKEN \
            pactfoundation/pact-cli pact-broker can-i-deploy \
            --pacticipant order-service --version "$version" \
            --to-environment production \
            --retry-while-unknown 10 --retry-interval 5
